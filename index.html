<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff4dc">
<title>なんこかな？ さんすう</title>
<style>
:root{--ink:#4a3a40;--pink:#e2557d;--orange:#f08a4b;--green:#5bb56a;--blue:#4a9fe0;--card:#fff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:linear-gradient(#fff4dc,#ffe9ef 60%,#e6f6e4);overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
.bunny{display:block;overflow:visible;aspect-ratio:120/130;height:auto;filter:drop-shadow(0 4px 4px rgba(170,110,40,.2))}
.bunny *{transform-box:fill-box}
.lion-ear{transform-origin:50% 90%;animation:earWiggle 3.4s ease-in-out infinite}
.lion-ear.r{animation-delay:.5s}
.lion-eyes{transform-origin:50% 50%;animation:blink 4.2s infinite}
.lion-tail{transform-origin:0% 100%;animation:swish 1.8s ease-in-out infinite}
.lion-head{transform-origin:50% 85%;animation:tilt 5s ease-in-out infinite}
@keyframes earWiggle{0%,78%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}92%{transform:rotate(6deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
.bunny.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.bunny.party{animation:party .7s ease-in-out infinite}
@keyframes hop{40%{transform:translateY(-18px) rotate(-6deg)}}
@keyframes party{25%{transform:translateY(-14px) rotate(-8deg)}75%{transform:translateY(-14px) rotate(8deg)}}

h1{text-align:center;font-size:clamp(30px,9vw,42px);line-height:1.25;margin:18px 0 6px}
h1 .o{color:var(--orange)}
.sub{text-align:center;margin:0 0 10px;font-size:16px;opacity:.8}
.big-btn{background:var(--orange);color:#fff;font-size:26px;font-weight:bold;padding:14px 40px;border-radius:999px;box-shadow:0 6px 0 #c9662e;margin-top:14px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9662e}
.chip{white-space:nowrap;flex:none;background:#fff;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:bold;box-shadow:0 3px 0 #0000001a}

/* setup */
.setup-lion{width:min(150px,40vw);margin:6px auto}
.field{width:min(360px,92vw);background:#fff;border-radius:22px;padding:16px;box-shadow:0 5px 0 #0000000f;margin-top:6px}
.field label{display:block;font-weight:bold;margin-bottom:8px}
.field input{width:100%;font:inherit;font-size:26px;padding:10px 14px;border-radius:14px;border:3px solid #f3d9c9;outline:none;text-align:center}
.field input:focus{border-color:var(--orange)}
.suffix{display:flex;gap:8px;margin-top:12px}
.suffix button{flex:1;padding:10px 0;border-radius:14px;background:#fff6ef;font-size:20px;font-weight:bold;border:3px solid transparent}
.suffix button[aria-pressed="true"]{border-color:var(--orange);background:#fff}
.preview{text-align:center;margin-top:10px;font-size:18px}
.preview b{color:var(--pink)}

/* home */
.home-top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
.home-hello{display:flex;align-items:center;gap:10px;width:100%;max-width:520px;margin:10px 0}
.home-hello .bunny{width:96px;flex:none}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;font-size:18px;font-weight:bold;line-height:1.5;box-shadow:0 4px 0 #0000000f;position:relative}
.bubble b{color:var(--pink)}
.levels{display:grid;gap:10px;width:100%;max-width:520px}
.lv{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px 14px;text-align:left;box-shadow:0 5px 0 #0000000f}
.lv:active{transform:translateY(3px)}
.lv .num{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:bold}
.lv .t{flex:1}
.lv .t b{display:block;font-size:20px}
.lv .t span{font-size:13px;opacity:.75}
.lv .st{flex:none;font-size:15px;font-weight:bold;text-align:right;min-width:62px}
.lv .st .done{color:var(--pink);font-size:22px}
.bar{height:8px;background:#f2ebe6;border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.total{margin-top:12px;font-weight:bold;font-size:17px}
.total b{color:var(--orange);font-size:22px}
.medals{margin-top:4px;font-size:15px}

/* play */
.play-top{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dots{display:flex;gap:4px;justify-content:center;flex:1;min-width:0}
.dots i{flex:none;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #f1d7c8}
.dots i.ok{background:var(--green);box-shadow:none}
.dots i.now{box-shadow:inset 0 0 0 3px var(--orange)}
.q-row{display:flex;align-items:flex-start;gap:6px;width:100%;max-width:560px;margin:6px 0 4px}
.q-row .bunny{width:58px;flex:none;margin-top:4px}
.q-row .bubble{flex:1;font-size:clamp(16px,4.5vw,21px);padding:10px 14px;line-height:1.45}
.q-row .bubble .n{color:var(--blue);font-size:1.25em}
.q-row .bubble .ask{color:var(--orange);display:block;margin-top:4px}
.say{flex:none;width:58px;padding:6px 0 5px;border-radius:16px;background:#fff;font-size:22px;line-height:1;box-shadow:0 3px 0 #0000001a;margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.say small{font-size:10px;font-weight:bold;letter-spacing:-.5px}
.answers.locked button{opacity:.4;pointer-events:none}
.msg.listen{color:var(--ink);opacity:.6}
.scene{width:100%;max-width:560px;min-height:120px;background:#fffdf8;border-radius:24px;box-shadow:0 5px 0 #0000000f;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px 8px 18px;position:relative}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:230px;padding:8px;border-radius:18px;background:#fff3e6}
.grp.b{background:#e9f5ff}
.plus{font-size:40px;font-weight:bold;color:var(--orange)}
.it{position:relative;line-height:1;cursor:pointer;transition:transform .2s,opacity .5s,filter .5s}
.it.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.em{display:block}
.em svg{display:block;width:1.1em;height:1.15em}
.it.wait{visibility:hidden}
.it .badge{position:absolute;right:-4px;top:-6px;background:var(--pink);color:#fff;font-size:13px;font-weight:bold;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-family:sans-serif}
.it.gone{transform:scale(.88)}
.it.gone .em{opacity:.3;filter:grayscale(1)}
.it.gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#e0413a;font-weight:bold;font-size:.9em}
.hint{position:absolute;bottom:6px;right:12px;font-size:12px;opacity:.6}
.formula{height:36px;font-size:28px;font-weight:bold;margin:4px 0 2px;letter-spacing:2px}
.formula .ans{color:var(--pink)}
.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:520px}
.answers button{aspect-ratio:6/5;border-radius:20px;background:#fff;font-size:clamp(28px,8vw,40px);font-weight:bold;box-shadow:0 5px 0 #e9d6cb;font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",sans-serif}
.answers button:active{transform:translateY(3px);box-shadow:0 2px 0 #e9d6cb}
.answers button.right{background:var(--green);color:#fff;box-shadow:0 5px 0 #3e8a4b}
.answers button.wrong{animation:shake .4s;background:#ffe3e3}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.next{margin-top:4px;padding:10px 40px}
.msg{min-height:26px;font-size:19px;font-weight:bold;margin-top:4px;text-align:center}
.msg.good{color:var(--green)}
.msg.try{color:var(--orange)}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(255,248,236,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:20px;text-align:center}
.overlay .bunny{width:min(170px,44vw)}
.overlay h2{font-size:clamp(28px,8vw,40px);margin:10px 0 4px;color:var(--pink)}
.overlay p{font-size:20px;font-weight:bold;margin:4px 0}
.stars{font-size:56px;color:#ffc531;text-shadow:0 3px 0 #e8a400}
.medal{font-size:90px;animation:hop 1s infinite}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.credit{font-size:11px;opacity:.55;margin-top:auto;padding-top:14px;text-align:center}
</style>
</head>

const ANI = { c:'ひき', cs:'匹', q:'なんびき' }, BIRD = { e:BIRDIMG, c:'わ', cs:'羽', q:'なんわ' };

const ADD = [
  () => { const I = it(FOOD);  return { ...I, t:(a,b)=>[`${N()}の いえに ${I.w}が ${n(a)}${I.c} あります。`, `おばあちゃんが ${I.w}を ${n(b)}${I.c} ${I.verb || 'くれました'}。`, `あわせて ${I.q}？`] }; },
  () => { const I = it(THING); return { ...I, t:(a,b)=>[`${N()}は ${I.w}を ${n(a)}${I.c} もっています。`, `ママが ${n(b)}${I.c} くれました。`, `ぜんぶで ${I.q}？`] }; },
  () => { const I = it(FOOD);  return { ...I, t:(a,b)=>[`${N()}の おさらに ${I.w}が ${n(a)}${I.c} あります。`, `パパが ${n(b)}${I.c} ${I.verb || 'のせて くれました'}。`, `ぜんぶで ${I.q}？`] }; },
  () => { const [w,e,pl,act] = pick(ANIMAL); return { e, ...ANI, t:(a,b)=>[`${N()}が ${pl}に いくと、${w}さんが ${n(a)}ひき ${act}。`, `${n(b)}ひき あそびに きました。`, 'みんなで なんびき？'] }; },
  () => ({ ...BIRD, t:(a,b)=>[`${N()}の いえの きに、ことりが ${n(a)}わ います。`, `${n(b)}わ とんで きました。`, 'ぜんぶで なんわ？'] }),
  () => { const I = it(THING); return { ...I, t:(a,b)=>[`${N()}は ${I.w}を ${n(a)}${I.c} もっています。`, `おともだちが ${n(b)}${I.c} くれました。`, `あわせて ${I.q}？`] }; },
];
const SUB = [
  () => ({ e:'🍓', c:'こ', cs:'個', q:'なんこ', cake:true, t:(a,b)=>[`ケーキに いちごが ${n(a)}こ のっていました。`, `${N()}が ${n(b)}こ たべました。`, 'のこりは なんこ？'] }),
  () => { const I = it(FOOD);  return { ...I, t:(a,b)=>[`おさらに ${I.w}が ${n(a)}${I.c} ありました。`, `${N()}が ${n(b)}${I.c} たべました。`, `のこりは ${I.q}？`] }; },
  () => { const I = it(THING); return { ...I, t:(a,b)=>[`${N()}は ${I.w}を ${n(a)}${I.c} もっていました。`, `パパに ${n(b)}${I.c} あげました。`, `のこりは ${I.q}？`] }; },
  () => ({ e:'🐟', ...ANI, t:(a,b)=>[`${N()}が いけを みると、さかなが ${n(a)}ひき いました。`, `${n(b)}ひき およいで いきました。`, 'のこりは なんびき？'] }),
  () => ({ ...BIRD, t:(a,b)=>[`${N()}の いえの きに、ことりが ${n(a)}わ いました。`, `${n(b)}わ とんで いきました。`, 'のこりは なんわ？'] }),
  () => ({ e:'🎈', c:'こ', cs:'個', q:'なんこ', t:(a,b)=>[`${N()}は ふうせんを ${n(a)}こ もっていました。`, `${n(b)}こ とんで いっちゃった。`, 'のこりは なんこ？'] }),
  () => { const [w,e,pl,act] = pick(ANIMAL); return { e, ...ANI, t:(a,b)=>[`${pl}で ${w}さんが ${n(a)}ひき ${act}。`, `${n(b)}ひき おうちに かえりました。`, 'のこりは なんびき？'] }; },
];
// keep each set of 10 fresh: no repeated numbers in the set, no same story or same picture twice in a row
let round = { lv:-1, nums:new Set(), lastTpl:'', lastE:'' };
function resetRound(lv) { round = { lv, nums:new Set(), lastTpl:'', lastE:'' }; }
function makeProblem(lv) {
  const L = LEVELS[lv];
  if (round.lv !== lv || S.prog[lv] === 0 && round.nums.size >= PER) resetRound(lv);
  let best = null;
  for (let tryN = 0; tryN < 300; tryN++) {
    const mode = L.mode === 'mix' ? (Math.random() < .5 ? 'add' : 'sub') : L.mode;
    let a, b, ans;
    if (mode === 'add') {
      ans = L.max === 5 ? rnd(2,5) : rnd(lv === 1 ? 5 : 3, 10);
      a = rnd(1, ans-1); b = ans - a;
    } else {
      a = L.max === 5 ? rnd(2,5) : rnd(lv === 3 ? 6 : 3, 10);
      b = rnd(1, a-1); ans = a - b;
    }
    const list = mode === 'add' ? ADD : SUB, ti = Math.floor(Math.random()*list.length);
    const tpl = list[ti](), tKey = mode + ti, nKey = mode + a + '-' + b;
    const okNum = !round.nums.has(nKey) || tryN > 200;   // relax only if every pair is used up
    const okTpl = tKey !== round.lastTpl, okPic = tpl.e !== round.lastE;
    if (okNum && okTpl && okPic) { best = { mode, a, b, ans, ...tpl, lines: tpl.t(a,b), nKey, tKey }; break; }
  }
  if (!best) { // practically never: fall back to anything valid
    const a = 2, b = 1; const tpl = ADD[0](); best = { mode:'add', a, b, ans:3, ...tpl, lines: tpl.t(a,b), nKey:'add2-1', tKey:'add0' };
  }
  round.nums.add(best.nKey); round.lastTpl = best.tKey; round.lastE = best.e;
  if (round.nums.size > PER) round.nums = new Set([best.nKey]);
  return best;
}

/* ---------- screens ---------- */
const screens = ['setup','home','play'];
function show(id) { screens.forEach(s => $(s).hidden = s !== id); window.scrollTo(0,0); }
const LION = document.querySelector('#homeLion').innerHTML;
function hop(el) { el.classList.remove('hop'); void el.getBoundingClientRect(); el.classList.add('hop'); }

/* setup */
function openSetup() {
  $('nameIn').value = S.name;
  document.querySelectorAll('.suffix button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === S.suf)));
  updPreview(); show('setup');
}
function curSuf() { const b = document.querySelector('.suffix button[aria-pressed="true"]'); return b ? b.dataset.s : 'ちゃん'; }
function updPreview() {
  const v = $('nameIn').value.trim();
  $('preview').innerHTML = v ? `もんだいに <b>${esc(v + curSuf())}</b> が でてくるよ` : 'なまえを いれてね';
}
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('nameIn').addEventListener('input', updPreview);
document.querySelectorAll('.suffix button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.suffix button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); updPreview(); sfx.tap();
}));
$('setupGo').addEventListener('click', () => {
  audio();
  const v = $('nameIn').value.trim();
  if (!v) { $('nameIn').focus(); $('preview').innerHTML = '<b>なまえを いれてね</b>'; return; }
  S.name = esc(v); S.suf = curSuf(); save(); sfx.right(); playSong('calm'); openHome();
});

/* home */
function openHome() {
  const total = S.prog.reduce((x,y)=>x+y,0);
  $('homeMsg').innerHTML = total === 0 ? `<b>${who()}</b>、いっしょに<br>さんすう しよう！` : total >= 50 ? `<b>${who()}</b>、ぜんぶ できたね！<br>もういちど やってみる？` : `<b>${who()}</b>、どれに する？`;
  $('levels').innerHTML = LEVELS.map((L,i) => {
    const p = S.prog[i], done = p >= PER;
    return `<button class="lv" type="button" data-lv="${i}"><span class="num" style="background:${L.color}">${i+1}</span><span class="t"><b>${L.name}</b><span>${L.sub}</span><div class="bar"><i style="width:${p*10}%"></i></div></span><span class="st">${done ? '<span class="done">★</span><br>クリア' : p + ' / ' + PER}</span></button>`;
  }).join('');
  $('levels').querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => { audio(); sfx.tap(); startLevel(+b.dataset.lv); }));
  $('total').innerHTML = `ぜんぶで <b>${Math.min(total,50)}</b> / 50もん`;
  $('medals').textContent = S.medals ? `🏅 ぜんぶクリア ${S.medals}かい` : '';
  $('voiceBtn').textContent = S.voice ? 'こえ：あり' : 'こえ：なし';
  $('musicBtn').textContent = S.music ? '♪ おんがく' : '♪ なし';
  if (ac) playSong('calm');
  show('home');
}
$('renameBtn').addEventListener('click', () => { sfx.tap(); openSetup(); });
$('voiceBtn').addEventListener('click', () => { S.voice = !S.voice; save(); $('voiceBtn').textContent = S.voice ? 'こえ：あり' : 'こえ：なし'; if (!S.voice) hush(); sfx.tap(); });
$('homeLion').addEventListener('click', e => hop(e.currentTarget));
$('musicBtn').addEventListener('click', () => { S.music = !S.music; save(); audio(); $('musicBtn').textContent = S.music ? '♪ おんがく' : '♪ なし'; playSong('calm'); setBgm(curVol()); sfx.tap(); });

/* play */
let LV = 0, P = null, counted = 0, tries = 0, solved = false;
function startLevel(lv) {
  LV = lv;
  if (S.prog[lv] >= PER) { S.prog[lv] = 0; save(); }
  resetRound(lv);
  $('lvName').textContent = `${lv+1} ${LEVELS[lv].name}`;
  $('lvName').style.background = LEVELS[lv].color; $('lvName').style.color = '#fff';
  audio(); playSong('calm');
  show('play'); nextProblem();
}
function renderDots() {
  const p = S.prog[LV];
  $('dots').innerHTML = Array.from({length:PER}, (_,i) => `<i class="${i < p ? 'ok' : i === p ? 'now' : ''}"></i>`).join('');
}
function itemSize(total) { return total <= 5 ? 46 : total <= 8 ? 38 : 32; }
function nextProblem() {
  P = makeProblem(LV); counted = 0; tries = 0; solved = false;
  const my = P;
  renderDots();
  $('story').innerHTML = P.lines.map((l,i) => i === 2 ? `<span class="ask">${l}</span>` : l).join('<br>');
  $('formula').innerHTML = ''; $('msg').textContent = ''; $('msg').className = 'msg';
  $('nextBtn').hidden = true;
  const sc = $('scene'), sz = itemSize(P.mode === 'add' ? P.a + P.b : P.a);
  const items = (k, cls='') => Array.from({length:k}, (_,i) => `<span class="it ${cls}" style="font-size:${sz}px;animation-delay:${i*70}ms"><span class="em">${P.e}</span></span>`).join('');
  let second = null;
  $('answers').classList.add('locked');
  $('msg').textContent = 'よく きいてね'; $('msg').className = 'msg listen';
  if (P.mode === 'add') {
    sc.innerHTML = `<div class="grp">${items(P.a,'pop')}</div><span class="plus wait" style="visibility:hidden">＋</span><div class="grp b">${items(P.b,'wait')}</div><span class="hint">さわると かぞえるよ</span>`;
    // the 2nd group comes in while the 2nd sentence is read
    second = () => {
      const plus = sc.querySelector('.plus'); if (plus) plus.style.visibility = '';
      sc.querySelectorAll('.grp.b .it').forEach((el,i) => { el.style.animationDelay = (i*260) + 'ms'; el.classList.remove('wait'); el.classList.add('pop'); setTimeout(() => sfx.tap(), i*260); });
    };
  } else {
    sc.innerHTML = `<div class="grp" style="max-width:320px">${P.cake ? '<span style="font-size:'+(sz+10)+'px;width:100%;text-align:center">🎂</span>' : ''}${items(P.a,'pop')}</div><span class="hint">さわると かぞえるよ</span>`;
    const goners = [...sc.querySelectorAll('.it')].slice(P.a - P.b);
    goners.forEach(el => el.dataset.go = '1');
    // ✕ goes on slowly, while the 2nd sentence ("〜 たべました") is read
    second = () => goners.forEach((el,i) => setTimeout(() => { if (P === my && !solved) { el.classList.add('gone'); sfx.poof(); } }, 700 + i*550));
  }
  // show the whole picture at once (used when the story is interrupted or replayed)
  revealNow = () => {
    if (P !== my) return;
    sc.querySelectorAll('.it.wait').forEach(el => { el.classList.remove('wait'); el.classList.add('pop'); el.style.animationDelay = '0ms'; });
    const pl = sc.querySelector('.plus'); if (pl) pl.style.visibility = '';
    sc.querySelectorAll('.it[data-go]').forEach(el => el.classList.add('gone'));
    unlock();
  };
  sc.querySelectorAll('.it').forEach(el => el.addEventListener('click', () => tapItem(el)));
  $('answers').innerHTML = Array.from({length:10}, (_,i) => `<button type="button" data-v="${i+1}">${i+1}</button>`).join('');
  $('answers').querySelectorAll('button').forEach(b => b.addEventListener('click', () => answer(+b.dataset.v, b)));
  let done2 = false;
  say(storyParts(), i => { if (i === 1 && !done2 && P === my) { done2 = true; second(); } }, () => revealNow());
}
// sentences for the voice: digits + 個/匹/羽/枚 so the device reads さんこ・いっぴき correctly
function storyParts() {
  // particle は is read as "wa": write it as わ for the voice only (display keeps は)
  return P.lines.map(l => l.replace(/<[^>]+>/g,'').replace(/(\d+)(こ|ひき|わ|まい)/g, (m,d) => d + P.cs).replace(/は(?=[\s　、])/g, 'わ'));
}
let revealNow = () => {};
function unlock() {
  const a = $('answers'); if (!a.classList.contains('locked')) return;
  a.classList.remove('locked');
  if ($('msg').classList.contains('listen')) { $('msg').textContent = ''; $('msg').className = 'msg'; }
}
function readStory() {
  // re-reading: show the whole picture right away, then read again
  revealNow();
  say(storyParts());
}
$('sayBtn').addEventListener('click', () => { audio(); readStory(); hop($('playLion')); });
$('playLion').addEventListener('click', e => { hop(e.currentTarget); readStory(); });
function tapItem(el) {
  audio();
  if (solved) return;
  if (el.classList.contains('wait') || $('answers').classList.contains('locked')) return;
  if (el.classList.contains('gone') || el.querySelector('.badge')) { el.style.transform = 'scale(1.15)'; setTimeout(()=>el.style.transform='',150); return; }
  counted++;
  const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = counted; el.appendChild(bd);
  el.style.transform = 'scale(1.2)'; setTimeout(()=>el.style.transform='',160);
  sfx.count(Math.min(counted,10)); say(NUMSAY[counted] || String(counted));
}
function answer(v, btn) {
  if (solved) return;
  audio();
  if (v === P.ans) {
    solved = true; btn.classList.add('right'); sfx.right(); hop($('playLion'));
    // show everything (2nd group / ✕) even if answered before the story finished
    $('scene').querySelectorAll('.it.wait').forEach(el => el.classList.remove('wait'));
    { const pl = $('scene').querySelector('.plus'); if (pl) pl.style.visibility = ''; }
    $('scene').querySelectorAll('.it[data-go]').forEach(el => el.classList.add('gone'));
    $('formula').innerHTML = `${P.a} ${P.mode === 'add' ? '＋' : '－'} ${P.b} ＝ <span class="ans">${P.ans}</span>`;
    const praise = pick(['せいかい！','すごい！','やったね！','ばっちり！']);
    $('msg').textContent = `${praise} ${P.ans}${P.c}！`; $('msg').className = 'msg good';
    const me = P; let shown = false;
    const goOn = () => {
      if (P !== me || shown) return; shown = true;
      if (S.prog[LV] >= PER) setTimeout(levelClear, 300);
      else $('nextBtn').hidden = false;
    };
    say(`${praise} ${P.ans}${P.cs}`, null, goOn);
    setTimeout(goOn, 5000);   // in case the device never reports the end of speech
    confetti(40);
    S.prog[LV] = Math.min(PER, S.prog[LV] + 1); save(); renderDots();

  } else {
    revealNow();
    tries++; btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong'); sfx.wrong();
    $('msg').className = 'msg try';
    if (tries >= 2) { $('msg').textContent = 'いっしょに かぞえて みよう！'; say('いっしょに かぞえて みよう'); autoCount(); }
    else { $('msg').textContent = 'おしい！ もういちど かぞえてみよう'; say('おしい！ もういちど かぞえてみよう'); }
  }
}
function autoCount() {
  const els = [...$('scene').querySelectorAll('.it')].filter(el => !el.dataset.go);
  $('scene').querySelectorAll('.badge').forEach(b => b.remove()); counted = 0;
  els.forEach((el,i) => setTimeout(() => { if (!solved) tapItem(el); }, 900 + i*750));
}
$('nextBtn').addEventListener('click', () => { sfx.tap(); nextProblem(); });
$('backBtn').addEventListener('click', () => { sfx.tap(); hush(); openHome(); });

/* level clear / all clear */
function levelClear() {
  const total = S.prog.reduce((x,y)=>x+y,0);
  const all = S.prog.every(p => p >= PER);
  if (all) {
    S.medals++; save();
    $('overBody').innerHTML = `<div class="medal">🏅</div><h2>50もん ぜんぶ クリア！</h2><p>${who()}、すごい！<br>たしざんも ひきざんも できたね！</p>`;
    say(`${who()}、すごい！ 50もん ぜんぶ クリア！`);
    sfx.fanfare(); confetti(260); playSong('party');
    $('overBtn').textContent = 'もどる';
    $('overBtn').onclick = () => { $('over').hidden = true; S.prog = [0,0,0,0,0]; save(); playSong('calm'); openHome(); };
  } else {
    $('overBody').innerHTML = `<div class="stars">★</div><h2>レベル${LV+1} クリア！</h2><p>${who()}、10もん できたね！</p><p style="font-size:16px;opacity:.75">ぜんぶで ${total} / 50もん</p>`;
    say(`レベル${LV+1} クリア！ ${who()}、10もん できたね`);
    sfx.fanfare(); confetti(140); playSong('party');
    $('overBtn').textContent = 'つぎへ';
    $('overBtn').onclick = () => { $('over').hidden = true; playSong('calm'); openHome(); };
  }
  $('over').hidden = false;
}

/* confetti */
const cv = $('fx'), cx = cv.getContext('2d'); let parts = [], raf = 0;
function fit(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', fit); fit();
function confetti(k) {
  const cols = ['#f08a4b','#e2557d','#4a9fe0','#5bb56a','#ffd23f','#9b6bd6'];
  for (let i=0;i<k;i++) parts.push({ x:Math.random()*cv.width, y:-20*devicePixelRatio - Math.random()*cv.height*.3, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:(4+Math.random()*5)*devicePixelRatio, c:pick(cols), a:Math.random()*6, va:(Math.random()-.5)*.3 });
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p => { p.x += p.vx*devicePixelRatio; p.y += p.vy*devicePixelRatio; p.a += p.va; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
  parts = parts.filter(p => p.y < cv.height + 30);
  raf = parts.length ? requestAnimationFrame(loop) : 0;
  if (!raf) cx.clearRect(0,0,cv.width,cv.height);
}

/* start */
if (S.name) openHome(); else openSetup();
})();
</script>
